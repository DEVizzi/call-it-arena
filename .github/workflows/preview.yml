name: Physics Games Preview (no posting, read-only state)

# Runs ONLY on pushes to preview branches. It renders sample videos as downloadable workflow artifacts.
# Safety:
# - No repository secrets are exposed (no YouTube/Instagram/Gemini tokens) → uploading is impossible.
# - `permissions: contents: read` and no git commit/push steps → state/ can never be changed in the repo.
# - state/ is made read-only inside the runner and verified unchanged with `git diff --exit-code`.
on:
  push:
    branches:
      - "preview/**"

permissions:
  contents: read

concurrency:
  group: physics-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  SDL_VIDEODRIVER: "dummy"
  SDL_AUDIODRIVER: "dummy"

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lock league state read-only
        run: chmod -R a-w state/
      - name: Run full test suite
        run: pytest -v
      - name: Verify league state untouched
        run: |
          git diff --exit-code -- state/
          test -z "$(git status --porcelain -- state/)"

  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "tower-defence-meteor-shower", format: tower_quake, arena: meteor_shower, seed: "PREVIEW-TD1", finale: "" }
          - { name: "tower-defence-cannon-barrage", format: tower_quake, arena: cannon_barrage, seed: "PREVIEW-TD7", finale: "" }
          - { name: "tower-defence-bomb-blitz", format: tower_quake, arena: bombs, seed: "PREVIEW-TD8", finale: "" }
          - { name: "tower-defence-ground-slam", format: tower_quake, arena: ground_slam, seed: "PREVIEW-TD9", finale: "" }
          - { name: "tower-defence-earthquake", format: tower_quake, arena: earthquake, seed: "PREVIEW-TD10", finale: "" }
          - { name: "tower-defence-APOCALYPSE-FINALE", format: tower_quake, arena: auto, seed: "PREVIEW-TD6", finale: "--finale" }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Cache Piper TTS voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/piper
          key: piper-voice-en_US-lessac-medium-v1
      - name: Install dependencies
        run: |
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install piper-tts || true
      - name: Lock league state read-only
        run: |
          sha256sum state/*.json | tee /tmp/state_before.sha
          chmod -R a-w state/
      - name: Render sample (no upload)
        run: |
          python scripts/preview_samples.py \
            --format "${{ matrix.format }}" \
            --arena "${{ matrix.arena }}" \
            --seed "${{ matrix.seed }}" \
            --out preview_out ${{ matrix.finale }}
      - name: Verify league state untouched
        run: |
          sha256sum -c /tmp/state_before.sha
          git diff --exit-code -- state/
          test -z "$(git status --porcelain -- state/)"  # no new state files (e.g. series.json) either
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            preview_out/*.mp4
            preview_out/*_sheet.png
            preview_out/*.json
          retention-days: 14
