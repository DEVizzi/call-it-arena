name: Physics Games Preview (no posting, read-only state)

# Runs ONLY on pushes to preview branches. It renders sample videos as downloadable workflow artifacts.
# Safety:
# - No repository secrets are exposed (no YouTube/Instagram/Gemini tokens) → uploading is impossible.
# - `permissions: contents: read` and no git commit/push steps → state/ can never be changed in the repo.
# - state/ is made read-only inside the runner and verified unchanged with `git diff --exit-code`.
on:
  push:
    branches:
      - "preview/**"

permissions:
  contents: read

concurrency:
  group: physics-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  SDL_VIDEODRIVER: "dummy"
  SDL_AUDIODRIVER: "dummy"

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lock league state read-only
        run: chmod -R a-w state/
      - name: Run full test suite
        run: pytest -v
      - name: Verify league state untouched
        run: git diff --exit-code -- state/

  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "league-auto-next-arena", format: marble_league, arena: auto, seed: "20261118-B" }
          - { name: "league-triple-ring", format: marble_league, arena: triple_ring, seed: "PREVIEW-L1" }
          - { name: "league-gravity-well", format: marble_league, arena: gravity_well, seed: "PREVIEW-L2" }
          - { name: "league-zigzag-ramps", format: marble_league, arena: zigzag_ramps, seed: "PREVIEW-L3" }
          - { name: "league-pendulum-gauntlet", format: marble_league, arena: pendulum_gauntlet, seed: "PREVIEW-L4" }
          - { name: "league-square-crusher", format: marble_league, arena: square_crusher, seed: "PREVIEW-L5" }
          - { name: "new-bucket-drop", format: bucket_drop, arena: auto, seed: "PREVIEW-B1" }
          - { name: "new-tower-quake", format: tower_quake, arena: auto, seed: "PREVIEW-T1" }
          - { name: "new-downhill-derby", format: downhill_derby, arena: auto, seed: "PREVIEW-D1" }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Cache Piper TTS voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/piper
          key: piper-voice-en_US-lessac-medium-v1
      - name: Install dependencies
        run: |
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install piper-tts || true
      - name: Lock league state read-only
        run: |
          sha256sum state/*.json | tee /tmp/state_before.sha
          chmod -R a-w state/
      - name: Render sample (no upload)
        run: |
          python scripts/preview_samples.py \
            --format "${{ matrix.format }}" \
            --arena "${{ matrix.arena }}" \
            --seed "${{ matrix.seed }}" \
            --out preview_out
      - name: Verify league state untouched
        run: |
          sha256sum -c /tmp/state_before.sha
          git diff --exit-code -- state/
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            preview_out/*.mp4
            preview_out/*_sheet.png
            preview_out/*.json
          retention-days: 14
