name: Call It Arena — Season Recap (long-form 16:9)

on:
  schedule:
    # Daily check ~3.5h after Slot B. Exits in seconds unless a season has just finished
    # (Race 28 Grand Final) and its long-form recap has not been posted yet.
    - cron: "20 17 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = latest finished season not yet posted | preview_so_far = current season so far (never uploads) | season = specific season"
        required: true
        default: "preview_so_far"
        type: choice
        options:
          - preview_so_far
          - auto
          - season
      season:
        description: "Season number (only for mode=season)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (render + validate + artifact, no upload)"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: call-it-arena-post
  cancel-in-progress: false

jobs:
  recap:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SDL_VIDEODRIVER: "dummy"
      SDL_AUDIODRIVER: "dummy"
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      INPUT_MODE: ${{ inputs.mode || 'auto' }}
      INPUT_SEASON: ${{ inputs.season || '' }}
      INPUT_DRY_RUN: ${{ inputs.dry_run || 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Is a recap due? (fast exit, no dependencies)
        id: due
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          mode = os.environ["INPUT_MODE"]
          if mode != "auto":
              print("due=true")
          else:
              league = json.load(open("state/league.json"))
              posted = json.load(open("state/posted.json")) if os.path.exists("state/posted.json") else {}
              done = set((posted.get("season_recaps") or {}).keys())
              finished = {str(c["season"]) for c in league.get("past_champions", [])}
              print("due=" + ("true" if finished - done else "false"))
          PY
          cat "$GITHUB_OUTPUT"

      - name: Set up Python 3.11 with pip cache
        if: steps.due.outputs.due == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache Piper TTS voice model (en_US-lessac-medium)
        if: steps.due.outputs.due == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/piper
          key: piper-voice-en_US-lessac-medium-v1

      - name: Install system & Python dependencies
        if: steps.due.outputs.due == 'true'
        run: |
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install piper-tts || true

      - name: Render, validate (and upload) the season recap
        if: steps.due.outputs.due == 'true'
        run: |
          ARGS="--season-recap --recap-stills output/recap_stills"
          if [ "$INPUT_MODE" = "preview_so_far" ]; then ARGS="$ARGS --recap-preview"; fi
          if [ "$INPUT_MODE" = "season" ] && [ -n "$INPUT_SEASON" ]; then ARGS="$ARGS --recap-season $INPUT_SEASON"; fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python main.py $ARGS

      - name: Upload recap MP4, thumbnail and QA stills as artifact
        if: steps.due.outputs.due == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: season-recap
          path: |
            output/season_recap_*.mp4
            output/season_recap_*_thumb.png
            output/recap_stills/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit recap record (live uploads only)
        if: steps.due.outputs.due == 'true' && env.INPUT_DRY_RUN != 'true' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/posted.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: season recap posted [skip ci]"
            git pull --rebase --autostash -X theirs origin main
            git push origin main
          fi
