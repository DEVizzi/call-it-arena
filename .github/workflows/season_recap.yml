name: Call It Arena — Season Recap (long-form 16:9)

on:
  schedule:
    # Daily check ~3.5h after Slot B. Exits in <2s unless a recap milestone is due:
    # Part 1 (Race 10), Part 2 (Race 20), Part 3 Finale (Race 28), or Full Season Movie (18h+ after Part 3).
    - cron: "20 17 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = next due milestone | preview_so_far = current season so far (dry run) | part1 / part2 / part3 / full = specific episode"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - preview_so_far
          - part1
          - part2
          - part3
          - full
      season:
        description: "Optional season number override (e.g. 1)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (render + validate + artifact, no upload)"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: call-it-arena-post
  cancel-in-progress: false

jobs:
  recap:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SDL_VIDEODRIVER: "dummy"
      SDL_AUDIODRIVER: "dummy"
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      INPUT_MODE: ${{ inputs.mode || 'auto' }}
      INPUT_SEASON: ${{ inputs.season || '' }}
      INPUT_DRY_RUN: ${{ inputs.dry_run || 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Is a recap milestone due? (fast exit, stdlib only)
        id: due
        run: |
          PYTHONPATH=. python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from common.recap_schedule import pick_next_due_recap
          mode = os.environ["INPUT_MODE"]
          if mode != "auto" or os.environ.get("INPUT_SEASON"):
              print("due=true")
          else:
              league = json.load(open("state/league.json"))
              posted = json.load(open("state/posted.json")) if os.path.exists("state/posted.json") else {}
              due = pick_next_due_recap(league, posted)
              print("due=" + ("true" if due else "false"))
              if due:
                  print(f"recap_key={due['key']}")
          PY
          cat "$GITHUB_OUTPUT"

      - name: Set up Python 3.11 with pip cache
        if: steps.due.outputs.due == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache Piper TTS voice model (en_US-lessac-medium)
        if: steps.due.outputs.due == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/piper
          key: piper-voice-en_US-lessac-medium-v1

      - name: Install system & Python dependencies
        if: steps.due.outputs.due == 'true'
        run: |
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install piper-tts || true

      - name: Render, validate (and upload) the season recap
        if: steps.due.outputs.due == 'true'
        run: |
          ARGS="--season-recap --recap-stills output/recap_stills"
          if [ "$INPUT_MODE" = "preview_so_far" ]; then
            ARGS="$ARGS --recap-preview"
          elif [ "$INPUT_MODE" != "auto" ]; then
            ARGS="$ARGS --recap-kind $INPUT_MODE"
          fi
          if [ -n "$INPUT_SEASON" ]; then ARGS="$ARGS --recap-season $INPUT_SEASON"; fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python main.py $ARGS

      - name: Upload recap MP4, thumbnail and QA stills as artifact
        if: steps.due.outputs.due == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: season-recap
          path: |
            output/season_recap_*.mp4
            output/season_recap_*_thumb.png
            output/recap_stills/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit recap record (live uploads only)
        if: steps.due.outputs.due == 'true' && env.INPUT_DRY_RUN != 'true' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/posted.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: season recap posted [skip ci]"
            git pull --rebase --autostash -X theirs origin main
            git push origin main
          fi
